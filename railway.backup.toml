[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backup"
watchPatterns = ["/scripts/run-daily-backup.mjs", "/Dockerfile.backup", "/railway.backup.toml"]

[deploy]
startCommand = "node run-daily-backup.mjs"
# Railway schedules use UTC: 13:30 UTC is 7:00 PM in Asia/Kolkata.
cronSchedule = "30 13 * * *"
restartPolicyType = "NEVER"
